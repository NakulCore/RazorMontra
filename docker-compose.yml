version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: razorpay-risk-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=False
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite+aiosqlite:///data/risk_copilot.db
      - PAYMENT_PROVIDER=mock
    volumes:
      - ./data:/app/data
      - ./ml/artifacts:/app/ml/artifacts
      - ./policies:/app/policies
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: razorpay-risk-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
